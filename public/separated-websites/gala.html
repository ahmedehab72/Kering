<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odette Home - Boutique Interior Design</title>

    <!-- GSAP Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Georgia", serif;
        overflow-x: hidden;
        background: #f5f3ef;
        color: #333;
      }

      /* HERO SECTION */
      .hero {
        height: 100vh;
        background: linear-gradient(135deg, #2d5f5d 0%, #3a7b78 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .hero::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.247) 0%,
          transparent 100%
        );
        animation: pulse 15s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.8;
        }
      }

      /* LOGO DESIGN - Large and Elegant */
      .logo {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        background: linear-gradient(135deg, #467675, #2c5f5c);
        overflow: hidden;
        transition: all 0.6s ease;
      }

      .logo-border {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        /* background: linear-gradient(135deg, #d4af37, #fff8dc); */
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-pattern {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-pattern img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        filter: brightness(0.95);
        transition: transform 0.8s ease;
      }

      .logo:hover img {
        transform: scale(1.08);
      }

      /* Floating shapes */
      .floating-shape {
        position: absolute;
        border-radius: 50%;
        opacity: 0.15;
        pointer-events: none;
        mix-blend-mode: overlay;
      }

      .brand-name {
        font-size: 18px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #fff;
        margin-top: 35px;
        opacity: 0.8;
        z-index: 2;
      }

      .hero-title {
        font-size: 72px;
        font-weight: 300;
        color: #fff;
        font-family: "Garamond", serif;
        font-style: italic;
        z-index: 2;
        margin-top: 15px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      /* NAVIGATION BAR */
      .navbar {
        width: 100%;
        padding: 20px 60px;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        justify-content: center;
        gap: 50px;
        position: fixed;
        bottom: 0;
        left: 0;
        z-index: 1000;
        color: white;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
        transition: all 0.6s ease;
      }

      .navbar.sticky {
        top: 0;
        bottom: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .nav-link {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: all 0.3s ease;
        position: relative;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 2px;
        background: #2c5f5c;
        transition: width 0.3s ease;
      }

      .nav-link:hover::after {
        width: 100%;
      }

      /* RIGHT-SIDE PAGINATION */
      .pagination {
        position: fixed;
        right: 30px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 18px;
        z-index: 1200;
      }

      .pagination .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        background: transparent;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .pagination .dot:hover {
        transform: scale(1.3);
        background: rgba(255, 255, 255, 0.3);
      }

      .pagination .dot.active {
        background: #2c5f5c;
        border-color: #2c5f5c;
        transform: scale(1.4);
      }

      /* GALLERY */
      .gallery {
        padding: 100px 60px;
        background: linear-gradient(180deg, #f5f3ef 0%, #e8e8e8 100%);
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 40px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .gallery-item:hover {
        transform: scale(1.02);
      }

      .gallery-img img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        display: block;
      }

      /* FASHION SECTION */
      .fashion {
        padding: 120px 60px;
        background: linear-gradient(135deg, #1a3a38 0%, #2d5f5d 100%);
        color: white;
        text-align: center;
      }

      .fashion-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 60px;
        max-width: 1400px;
        margin: 80px auto 0;
      }

      .fashion-item img {
        width: 100%;
        height: 400px;
        border-radius: 15px;
        object-fit: cover;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        transition: all 0.5s ease;
      }

      .fashion-item:hover img {
        transform: translateY(-10px);
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
      }

      /* FEATURES SECTION */
      .features {
        padding: 120px 60px;
        background: linear-gradient(180deg, #a8c9c3 0%, #8fb5af 100%);
        text-align: center;
      }

      .section-title {
        font-size: 42px;
        font-weight: 300;
        margin-bottom: 30px;
        font-style: italic;
        color: #2d2d2d;
      }

      .section-subtitle {
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 80px;
        color: #333;
      }

      .features-list {
        max-width: 800px;
        margin: 0 auto;
      }

      .feature-item {
        font-size: 20px;
        padding: 25px;
        margin: 20px 0;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition: all 0.4s ease;
      }

      .feature-item:hover {
        transform: translateX(20px);
        background: rgba(255, 255, 255, 0.8);
      }

      @media (max-width: 768px) {
        .gallery-grid,
        .fashion-grid {
          grid-template-columns: 1fr;
        }

        .hero-title {
          font-size: 42px;
        }

        .navbar {
          padding: 15px 20px;
          gap: 20px;
          flex-wrap: wrap;
        }

        .pagination {
          right: 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- HERO SECTION -->
    <section class="hero" id="hero">
      <div
        class="floating-shape"
        style="width: 300px; height: 300px; background: rgba(255, 255, 255, 0.3); top: 10%; left: 10%;"
      ></div>
      <div
        class="floating-shape"
        style="width: 200px; height: 200px; background: rgba(45, 95, 93, 0.2); bottom: 15%; right: 15%;"
      ></div>

      <div class="logo">
        <div class="logo-border">
          <div class="logo-pattern">
            <img src="/public/images/gridsection/Gala.jpg" alt="Odette Home Logo" />
          </div>
        </div>
      </div>

      <div class="brand-name">BOUTIQUE</div>
      <h1 class="hero-title">GALA</h1>
    </section>

    <!-- NAVIGATION -->
    <nav class="navbar">
      <a href="#" class="nav-link">Interior</a>
      <a href="#" class="nav-link">Design</a>
    </nav>

    <!-- PAGINATION (RIGHT SIDE) -->
    <div class="pagination">
      <a href="#hero" class="dot active" data-section="hero"></a>
      <a href="#gallery" class="dot" data-section="gallery"></a>
      <a href="#fashion" class="dot" data-section="fashion"></a>
      <a href="#features" class="dot" data-section="features"></a>
    </div>

    <!-- GALLERY -->
    <section class="gallery" id="gallery">
      <div class="gallery-grid">
        <div class="gallery-item">
          <div class="gallery-img">
            <img src="/public/images/gridsection/Gala.jpg" alt="gallery" />
          </div>
        </div>
        <div class="gallery-item">
          <div class="gallery-img">
            <img src="/public/images/gridsection/Glimpse.jpg" alt="gallery" />
          </div>
        </div>
      </div>
    </section>

    <!-- FASHION -->
    <section class="fashion" id="fashion">
      <div class="fashion-grid">
        <div class="fashion-item">
          <img src="/public/images/gridsection/Gala.jpg" alt="image" />
        </div>
        <div class="fashion-item">
          <img src="/public/images/gridsection/Gala.jpg" alt="image" />
        </div>
        <div class="fashion-item">
          <img src="/public/images/gridsection/imageTest.jpeg" alt="image" />
        </div>
      </div>
    </section>

    <!-- FEATURES -->
    <section class="features" id="features">
      <h2 class="section-title">What to Expect</h2>
      <p class="section-subtitle">Redefining Inspiring 21st Discourse</p>
      <div class="features-list">
        <div class="feature-item">Custom Interiors Carefully & Ethically Made</div>
        <div class="feature-item">1 kg $0.50 per Tonne & 1 PR</div>
        <div class="feature-item">Free Gift for Our 100k of Customers</div>
      </div>
    </section>

    <script>
      gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);

      // Hero animations
      gsap.from(".logo", {
        duration: 1.5,
        ease: "elastic.out(1, 0.5)",
        delay: 0.3,
      });

      gsap.to(".logo", {
        y: "+=15",
        duration: 3,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
      });

      gsap.from([".brand-name", ".hero-title"], {
        duration: 1,
        y: 50,
        opacity: 0,
        stagger: 0.3,
        delay: 1,
      });

      // Navbar transition
      const navbar = document.querySelector(".navbar");
      ScrollTrigger.create({
        trigger: ".hero",
        start: "bottom center",
        onEnter: () => {
          gsap.to(navbar, {
            bottom: "auto",
            top: 0,
            duration: 0.6,
            ease: "power2.out",
          });
          navbar.classList.add("sticky");
        },
        onLeaveBack: () => {
          gsap.to(navbar, {
            top: "auto",
            bottom: 0,
            duration: 0.6,
            ease: "power2.out",
          });
          navbar.classList.remove("sticky");
        },
      });

      // Gallery animation
      gsap.utils.toArray(".gallery-item").forEach((item, i) => {
        gsap.from(item, {
          scrollTrigger: { trigger: item, start: "top 80%" },
          x: i % 2 === 0 ? -100 : 100,
          opacity: 0,
          duration: 1,
          ease: "power3.out",
        });
      });

      // Fashion animation
      gsap.utils.toArray(".fashion-item").forEach((item, i) => {
        gsap.from(item, {
          scrollTrigger: { trigger: item, start: "top 85%" },
          y: 100,
          opacity: 0,
          rotation: 10,
          duration: 1,
          delay: i * 0.2,
          ease: "back.out(1.7)",
        });
      });

      // Features animation
      gsap.from(".section-title", {
        scrollTrigger: { trigger: ".features", start: "top 70%" },
        scale: 0.5,
        opacity: 0,
        duration: 1,
        ease: "back.out(1.7)",
      });

      gsap.from(".section-subtitle", {
        scrollTrigger: { trigger: ".features", start: "top 70%" },
        y: 30,
        opacity: 0,
        duration: 1,
        delay: 0.3,
      });

      gsap.utils.toArray(".feature-item").forEach((item, i) => {
        gsap.from(item, {
          scrollTrigger: { trigger: item, start: "top 90%" },
          x: -100,
          opacity: 0,
          duration: 0.8,
          delay: i * 0.15,
          ease: "power2.out",
        });
      });

      // Pagination active + smooth scroll
      const dots = document.querySelectorAll(".pagination .dot");
      const sections = document.querySelectorAll("section");

      dots.forEach((dot) => {
        dot.addEventListener("click", (e) => {
          e.preventDefault();
          const target = document.querySelector(dot.getAttribute("href"));
          gsap.to(window, { duration: 1, scrollTo: target, ease: "power2.inOut" });
        });
      });

      sections.forEach((section) => {
        ScrollTrigger.create({
          trigger: section,
          start: "top center",
          end: "bottom center",
          onEnter: () => setActiveDot(section.id),
          onEnterBack: () => setActiveDot(section.id),
        });
      });

      function setActiveDot(id) {
        dots.forEach((dot) => {
          dot.classList.toggle("active", dot.dataset.section === id);
        });
      }
    </script>
  </body>
</html>
